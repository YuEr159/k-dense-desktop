name: Release desktop

# Desktop builds are tagged separately from the upstream app: `v0.15.0d1`
# refers to the installer, not to server/package.json. Pushing that tag is the
# only trigger, so a normal code push never starts a 15-minute Windows build.
on:
  push:
    tags:
      - "v*"
  # A tag push runs the build once, at the moment the tag is created. When a
  # job is skipped — the version guard rejected the tag, or a platform failed
  # on a transient download — the only way back was to delete and re-push the
  # tag, which rewrites a published ref. This lets the same tag be built again,
  # and picks which platforms so a Windows-only rebuild does not spend 20
  # minutes on macOS runners.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the selected branch/ref)"
        required: false
        type: string
      platforms:
        description: "Which installers to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - mac

jobs:
  # The upstream Release workflow also fires on `v*` tags via the branch push,
  # but its own tag is v<server version>; this guard keeps the two apart.
  check:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.match.outputs.desktop }}
      version: ${{ steps.match.outputs.version }}
      tag: ${{ steps.match.outputs.tag }}
      platforms: ${{ steps.match.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: match
        # Manual input reaches the shell as an environment variable, not
        # interpolated into the script: a `${{ }}` splice of a user-supplied
        # string is a script injection, and this workflow holds contents: write.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          # A manual run has no tag in the ref, so it is named by input and the
          # release it attaches to is that same tag.
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [ -z "$TAG" ]; then
            echo "No tag given and the ref is not a tag; nothing to build." >&2
            exit 1
          fi
          PLATFORMS="${INPUT_PLATFORMS}"
          if [ -z "$PLATFORMS" ]; then PLATFORMS=both; fi
          VERSION=$(node -p "require('./desktop/package.json').version")
          # A tag is the human name for the build and does not have to be valid
          # semver, or even the same spelling as the version: `0.15.0d4`,
          # `0.15.0-d4` and a four-part `0.15.0.4` all name the same build, and
          # every one of them has appeared in this repository's tags. Compare
          # the numbers they contain, in order — that is the part that
          # identifies the build, and it is the only form all spellings share.
          numbers() {
            node -p "(process.argv[1].match(/\d+/g) ?? []).join('.')" "$1"
          }
          if [ "$(numbers "$TAG")" = "$(numbers "v$VERSION")" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::error::$TAG does not name this build ($VERSION). Bump desktop/package.json or pick the matching tag."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    if: needs.check.outputs.desktop == 'true' && needs.check.outputs.platforms != 'mac'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.tag }}

      # The payload is compiled from server/ and web/, so both need their
      # dependencies and a Next standalone build before staging.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend (standalone output)
        working-directory: web
        run: npx next build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage runtime payload
        run: node desktop/scripts/build-runtime.mjs

      # The ico is generated, not committed, so the runner must build it before
      # electron-builder looks for resources/icon.ico.
      - name: Generate app icon
        run: node desktop/scripts/make-icon.mjs

      # Downloads PortableGit and uv. Pinned by version with sha256 on uv; the
      # GitHub release asset is the primary source with a Tsinghua mirror.
      - name: Stage bundled binaries
        run: node desktop/scripts/fetch-externals.mjs

      # Fails the job rather than shipping a bundle that only works because the
      # runner happens to have its own Git for Windows.
      - name: Verify the bundle is self-sufficient
        run: node desktop/scripts/verify-externals.mjs

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --config electron-builder.json --win

      - name: Upload installer to the release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run has no tag in its ref, so name the release explicitly;
          # otherwise the action targets the branch and creates one there. On a
          # tag push this is the same tag it would have inferred.
          tag_name: ${{ needs.check.outputs.tag }}
          # The zip is the portable build: unpack and run, no installer, no
          # admin prompt, nothing written to the registry. Same bundle, so both
          # artifacts come out of the one electron-builder run above.
          files: |
            dist/Kady-*-Setup.exe
            dist/Kady-*-Portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  mac:
    needs: check
    if: needs.check.outputs.desktop == 'true' && needs.check.outputs.platforms != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    # A cold macOS runner spends most of this building the Next payload and
    # downloading uv; the workflow's own 45-minute ceiling has been enough, so
    # the release job uses the same one rather than a shorter guess.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The matrix asserts the runner matches: an arm64 payload built on Intel
      # (or the reverse) would install and then fail to launch.
      - name: Verify native runner
        run: node -e "if(process.arch !== '${{ matrix.arch }}') process.exit(1)"

      - run: npm ci --no-audit
        working-directory: server

      - run: npm ci --no-audit
        working-directory: web

      - run: npm ci --no-audit
        working-directory: desktop

      - name: Stage Mac tools
        run: node desktop/scripts/fetch-externals.mjs

      # `dist:mac` pins identity to "-" (ad-hoc) and uses the entitlements that
      # allow loading an unsigned Electron framework, so no signing secret is
      # involved. The app is not notarized: a downloaded copy needs the
      # Privacy & Security approval documented in desktop/MACOS.md.
      - name: Build ad-hoc signed app, DMG and ZIP
        working-directory: desktop
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run dist:mac

      - name: Verify bundle signature
        run: codesign --verify --deep --strict dist/mac*/Kady.app

      - name: Upload disk image and archive to the release
        uses: softprops/action-gh-release@v2
        with:
          # See the Windows job: a manual run has no tag in its ref.
          tag_name: ${{ needs.check.outputs.tag }}
          # electron-builder writes to the repo root (directories.output is
          # "../dist"), not desktop/dist.
          files: |
            dist/Kady-*-mac-*.dmg
            dist/Kady-*-mac-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
