name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (vitest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm install
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: true
          cache-dependency-glob: server/src/helpers/uv.lock
      - name: Install scientific test dependencies
        run: uv sync --frozen --project server/src/helpers --python 3.12.14 --python-preference only-managed
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Run tests
        working-directory: server
        run: npm test

  frontend:
    name: frontend (vitest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test

  desktop:
    name: desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary release platform, but the shell's tests used
        # to run only inside the macOS build workflow. The suite here is the
        # platform-agnostic half; macOS-only assertions stay in
        # macos-desktop.yml, where the paths they check actually apply.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      # The shell has no runtime dependencies; skipping install keeps this job
      # to a few seconds and avoids a lockfile check for a package tree the
      # tests never import.
      - name: Run shell tests
        working-directory: desktop
        run: node --test test/platform-agnostic.test.mjs test/window-state.test.mjs test/startup.test.mjs test/runtime-files.test.mjs test/icon.test.mjs

  launcher-smoke:
    name: launcher --check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the Intel image on purpose: `macos-latest` is arm64, and on
        # this account those runners sat in the queue until the job was
        # cancelled for days at a time, which turned the whole workflow red
        # without a single step having run. The launcher is a POSIX shell
        # script, so either macOS architecture verifies the same thing.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run start.sh --check
        if: runner.os != 'Windows'
        run: ./start.sh --check
      - name: Run start.cmd --check
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd --check
